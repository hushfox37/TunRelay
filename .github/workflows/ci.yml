name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore client
        run: dotnet restore Client/TunRelayClient.csproj

      - name: Restore server
        run: dotnet restore Server/TunRelayServer.csproj

      - name: Build client
        run: dotnet build Client/TunRelayClient.csproj --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Build server
        run: dotnet build Server/TunRelayServer.csproj --configuration "$BUILD_CONFIGURATION" --no-restore

  native-aot:
    name: Native AOT (${{ matrix.project }} ${{ matrix.runtime }})
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: client
            project-path: Client/TunRelayClient.csproj
            os: ubuntu-24.04-arm
            runtime: linux-arm64
          - project: client
            project-path: Client/TunRelayClient.csproj
            os: windows-latest
            runtime: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: dotnet publish "${{ matrix.project-path }}" --configuration "$BUILD_CONFIGURATION" --runtime "${{ matrix.runtime }}" --self-contained true --output "artifacts/${{ matrix.project }}-${{ matrix.runtime }}"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunrelay-${{ matrix.project }}-${{ matrix.runtime }}
          path: artifacts/${{ matrix.project }}-${{ matrix.runtime }}

  native-aot-linux-x64-lowglibc:
    name: Native AOT low glibc (${{ matrix.project }} linux-x64)
    needs: build
    runs-on: ubuntu-latest
    container: debian:11

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: client
            project-path: Client/TunRelayClient.csproj
          - project: server
            project-path: Server/TunRelayServer.csproj

    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git clang zlib1g-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
          ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
          dotnet --info

      - name: Publish Native AOT
        run: dotnet publish "${{ matrix.project-path }}" --configuration "$BUILD_CONFIGURATION" --runtime linux-x64 --self-contained true --output "artifacts/${{ matrix.project }}-linux-x64"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunrelay-${{ matrix.project }}-linux-x64
          path: artifacts/${{ matrix.project }}-linux-x64
